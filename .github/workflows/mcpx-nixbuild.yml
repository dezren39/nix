name: mcpx nix build

# CI policy: .github/ci-policy.md (design developing-today/code#1779
# §3.3/§3.4, as amended by #1172 — main-only tier).
#
# Narrow package-build verification (#418, rewired by #468).
#
# mcpx's source lives only in developing-today/code now; this repo no
# longer builds it from a local input - since #1388 the package arrives
# through the openchamber -> opencode chain (flake.nix re-exposes
# inputs.openchamber.inputs.opencode's mcpx, the fork's build of code's
# package). Evaluation cannot catch a stale vendorHash or a bad pin
# (the hash is just a string at eval time; it fails only when the
# go-modules derivation is actually built), so the full build is the
# main-tier check (below).
#
# Main-only tier (#1172 removed the pull_request eval tier; #1178
# removed its leftover job): push to main + nightly schedule +
# workflow_dispatch run the full build. The push trigger is
# restricted to branches: [main] and a small path set, and the
# nightly backstop means nothing the old PR build covered can
# vanish unnoticed — a break lands on main and the watcher files it.

on:
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/mcpx-nixbuild.yml"
  schedule:
    # Nightly backstop for the full main-tier build.
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Every run (push-to-main, nightly schedule, manual dispatch) gets
  # its own group (keyed by run_id), so a later merge can never
  # cancel — or displace a pending — verification run for an earlier
  # merge: every merged tree gets its own completed build.
  # (Downstream half of the cross-repo set tracked in
  # developing-today/code#392; the conditional cancel-in-progress
  # used by code's mcpx-conformance workflow would still let a third
  # rapid merge displace the second merge's pending run, so runs are
  # keyed by run_id here, the pattern developing-today-forks/opencode's
  # check.yml already uses for main.)
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  nix-build:
    name: nix build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      # Darwin mcpx skip guard (eval only, no darwin build): the
      # darwin -skip list is constructed inside code's package itself
      # (its goTestCmd, since developing-today/code PR #4799) - this
      # repo's old flake.nix override is gone (#1388). The guard evals
      # the aarch64-darwin checkPhase the chain delivers and fails if
      # the -skip list ever stops arriving (developing-today/code#418).
      - name: Darwin mcpx skip guard
        run: |
          phase="$(nix eval --raw .#packages.aarch64-darwin.mcpx.checkPhase)"
          printf '%s\n' "$phase"
          grep -F -- "-skip=" <<<"$phase"

      - name: Nix build
        run: nix build .#packages.x86_64-linux.mcpx --print-build-logs
