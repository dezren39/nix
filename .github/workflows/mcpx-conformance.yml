name: mcpx conformance

# The official MCP conformance suite (github.com/modelcontextprotocol/conformance) against mcpx,
# one job per leg. A leg is one side of the protocol (mcpx as a server, or as a client) checked
# against one spec revision. The suite has frozen requirement sets for 2025-11-25 and 2026-07-28;
# for 2025-03-26 and 2025-06-18 it has only the scenarios tagged for each, run with
# --spec-version, on both sides. "server-all" is every server scenario it has. It does not know
# 2024-11-05.
#
# NOT A BLOCK. A leg fails when any check fails, so the failures are visible, but no branch
# protection requires this workflow. The suite expects fixtures and behaviour a gateway does not
# always have; read the failures, do not chase the number.
#
# On main, the counts are compared with two records per leg kept in a repository variable
# (MCPX_CONFORMANCE_<LEG>), and the records are updated. See scripts/conformance-record.py for the
# rules. Writing a variable needs a token GITHUB_TOKEN cannot provide: a fine-grained token with
# "Variables: read and write" on this repository, stored as the secret MCPX_CONFORMANCE_VARS_TOKEN.

on:
  pull_request:
    paths:
      - "pkgs/mcpx/**"
      - ".github/workflows/mcpx-conformance.yml"
  push:
    branches: [main]
    paths:
      - "pkgs/mcpx/**"
      - ".github/workflows/mcpx-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

# Two runs on main must not read and write the records at the same time.
concurrency:
  group: mcpx-conformance-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Spec revisions one side is expected to have and the other not, as JSON
  # arrays, read by the spec parity job. An entry here is left out of that
  # comparison. If both sides come to have an entry, or its side drops it, the
  # job fails at once: the entry is dead and must be removed, or it would
  # hide a real mismatch on that revision later.
  #
  # 2024-11-05: mcpx serves it; the conformance suite has never tested it.
  SPEC_PARITY_ALLOW_ONLY_MCPX: '["2024-11-05"]'
  SPEC_PARITY_ALLOW_ONLY_SUITE: '[]'
  # The suite commit these results are measured against. Bump deliberately: a new suite commit can
  # add checks, which moves every number.
  CONFORMANCE_REPO: modelcontextprotocol/conformance
  CONFORMANCE_REF: 7169291ec0b68eb370fddcd9947313ab0d5e4156

jobs:
  leg:
    name: ${{ matrix.leg }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        leg:
          - server-2025-03-26
          - server-2025-06-18
          - server-2025-11-25
          - server-2026-07-28
          - server-all
          - client-2025-03-26
          - client-2025-06-18
          - client-2025-11-25
          - client-2026-07-28
        # mcpx has no OAuth client (docs/in-name-only.md), so every client
        # scenario under the suite's auth/ directory fails, and nothing else
        # should. These legs pass only at exactly these counts with every
        # failure in auth/: a new failure elsewhere, a lost pass, or an auth
        # check that starts passing all fail the job, so the numbers here
        # are updated deliberately rather than drifting.
        # "expect" is "passed failed" only; skipped checks are held separately
        # by the records job. Every check the suite skips or cannot test, on
        # any leg, and why, is in pkgs/mcpx/docs/spec/official-suite.md under
        # "Skipped, and why".
        include:
          - leg: client-2025-03-26
            expect: "0 7"
          - leg: client-2025-06-18
            expect: "3 9"
          - leg: client-2025-11-25
            expect: "20 56"
          # Also 2 SKIPPED, both permanent: http-standard-headers checks the
          # Mcp-Method header on initialize and notifications/initialized,
          # which a 2026-07-28 client never sends (the revision removed the
          # handshake; a 2026-only server rejects initialize). The suite has
          # no way to mark them not applicable. upstream.protocol
          # prefer-initialize would send it, and is deliberately not the
          # default.
          - leg: client-2026-07-28
            expect: "67 68"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: pkgs/mcpx/go.mod
          cache-dependency-path: pkgs/mcpx/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.CONFORMANCE_REPO }}
          ref: ${{ env.CONFORMANCE_REF }}
          path: .conformance

      - name: Run the leg
        id: run
        working-directory: pkgs/mcpx
        env:
          CONFORMANCE_DIR: ${{ github.workspace }}/.conformance
          LEGS: ${{ matrix.leg }}
        run: |
          out="$RUNNER_TEMP/results"
          bash scripts/conformance.sh "$out" | tee "$RUNNER_TEMP/run.txt"
          line=$(grep -m1 -E '^Total: [0-9]+ passed, [0-9]+ failed' "$out/${{ matrix.leg }}/out.txt" || true)
          {
            if [ -z "$line" ]; then
              echo "parsed=false"; echo "passed=0"; echo "failed=0"
            else
              echo "parsed=true"
              echo "passed=$(sed -E 's/^Total: ([0-9]+) passed.*/\1/' <<<"$line")"
              echo "failed=$(sed -E 's/^Total: [0-9]+ passed, ([0-9]+) failed.*/\1/' <<<"$line")"
            fi
            echo "out=$out"
          } >>"$GITHUB_OUTPUT"

      - name: Summary
        id: summary
        if: always()
        env:
          LEG: ${{ matrix.leg }}
          EXPECT: ${{ matrix.expect }}
          PARSED: ${{ steps.run.outputs.parsed }}
          PASSED: ${{ steps.run.outputs.passed }}
          FAILED: ${{ steps.run.outputs.failed }}
          OUT: ${{ steps.run.outputs.out }}
        run: |
          {
            echo "## Conformance: \`$LEG\`"
            echo
            echo "> [!NOTE]"
            echo "> **Failed conformance checks do not block a merge.** This workflow is informational."
            echo
            if [ "$PARSED" != true ]; then
              echo "> [!CAUTION]"
              echo "> The suite produced no summary line. It did not run to completion; see the artifact."
            else
              echo "| checks passed | checks failed | total |"
              echo "| --- | --- | --- |"
              echo "| $PASSED | $FAILED | $((PASSED + FAILED)) |"
              echo
              echo "Suite \`$CONFORMANCE_REPO@${CONFORMANCE_REF:0:7}\`."
            fi
            f="$OUT/failures.txt"
            if [ -s "$f" ]; then
              echo
              echo "### Failures"
              echo
              echo "| scenario | check | status | message |"
              echo "| --- | --- | --- | --- |"
              # leg | scenario | check | status | message -- drop the leg, escape pipes in the message.
              awk -F' \\| ' '{msg=$5; for(i=6;i<=NF;i++) msg=msg " / " $i; gsub(/\|/,"\\|",msg);
                sub(/-20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]T[0-9-]+Z$/,"",$2);
                printf "| %s | %s | %s | %s |\n", $2, $3, $4, substr(msg,1,300)}' "$f"
            fi
          } >>"$GITHUB_STEP_SUMMARY"
          # Counted from every checks.json rather than the summary line, which
          # leaves warnings out: every check whatever its status, the
          # warnings, and the failures outside the suite's auth/ scenarios.
          read -r checks warnings nonauth skipped info < <(python3 - "$OUT/$LEG/results" "$RUNNER_TEMP/skipped-names.json" <<'EOF'
          import json, glob, os, re, sys
          root = sys.argv[1]
          checks = warnings = nonauth = skipped = info = 0
          names = []
          for f in glob.glob(os.path.join(root, '**', 'checks.json'), recursive=True):
              cs = json.load(open(f))
              scen = re.sub(r'-20\d\d-\d\d-\d\dT[\d-]+Z$', '', os.path.basename(os.path.dirname(f)))
              names += [f"{scen}/{c.get('id')}" for c in cs if c.get('status') == 'SKIPPED']
              checks += len(cs)
              warnings += sum(c.get('status') == 'WARNING' for c in cs)
              skipped += sum(c.get('status') == 'SKIPPED' for c in cs)
              info += sum(c.get('status') == 'INFO' for c in cs)
              if os.path.relpath(f, root).split(os.sep)[0] != 'auth':
                  nonauth += sum(c.get('status') == 'FAILURE' for c in cs)
          json.dump(sorted(names), open(sys.argv[2], 'w'))
          print(checks, warnings, nonauth, skipped, info)
          EOF
          )
          {
            echo "nonauth=$nonauth"
            echo "checks=$checks"
            echo "warnings=$warnings"
            echo "skipped=$skipped"
            echo "info=$info"
          } >>"$GITHUB_OUTPUT"
          {
            echo
            echo "| every check | passed | failed | skipped | warning | info |"
            echo "| --- | --- | --- | --- | --- | --- |"
            echo "| **$checks** | ${PASSED:-0} | ${FAILED:-0} | **$skipped** | $warnings | $info |"
            echo
            echo "Skipped checks pass nothing. A run with more than the record on \`main\` fails the records job."
          } >>"$GITHUB_STEP_SUMMARY"
          if [ -n "$EXPECT" ]; then
            {
              echo
              echo "Expected for this leg: \`$EXPECT\` (passed failed), every failure an OAuth scenario."
              echo "Failures outside \`auth/\`: **$nonauth**."
            } >>"$GITHUB_STEP_SUMMARY"
          fi
          mkdir -p "$RUNNER_TEMP/counts"
          printf '{"leg":"%s","parsed":%s,"passed":%s,"failed":%s,"checks":%s,"warnings":%s,"skipped":%s,"info":%s}\n' \
            "$LEG" "${PARSED:-false}" "${PASSED:-0}" "${FAILED:-0}" "${checks:-0}" "${warnings:-0}" \
            "${skipped:-0}" "${info:-0}" >"$RUNNER_TEMP/counts/$LEG.json"
          if [ -f "$RUNNER_TEMP/skipped-names.json" ]; then
            jq --slurpfile n "$RUNNER_TEMP/skipped-names.json" '.skipped_names = $n[0]' \
              "$RUNNER_TEMP/counts/$LEG.json" >"$RUNNER_TEMP/c.json" && mv "$RUNNER_TEMP/c.json" "$RUNNER_TEMP/counts/$LEG.json"
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: conformance-${{ matrix.leg }}
          path: |
            ${{ steps.run.outputs.out }}
            ${{ runner.temp }}/run.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: counts-${{ matrix.leg }}
          path: ${{ runner.temp }}/counts/${{ matrix.leg }}.json

      - name: Fail on any failed check
        if: always()
        run: |
          if [ "${{ steps.run.outputs.parsed }}" != true ]; then
            echo "::error::the suite did not produce a summary for ${{ matrix.leg }}"; exit 1
          fi
          got="${{ steps.run.outputs.passed }} ${{ steps.run.outputs.failed }}"
          if [ -n "${{ matrix.expect }}" ]; then
            if [ "$got" != "${{ matrix.expect }}" ] || [ "${{ steps.summary.outputs.nonauth }}" != 0 ]; then
              echo "::error::${{ matrix.leg }}: got '$got' (passed failed) with ${{ steps.summary.outputs.nonauth }} non-OAuth failure(s); expected '${{ matrix.expect }}' with none. Update matrix.expect in this workflow if the change is intended."
              exit 1
            fi
            echo "${{ matrix.leg }}: exactly the expected '$got', every failure OAuth"
            exit 0
          fi
          if [ "${{ steps.run.outputs.failed }}" != 0 ]; then
            echo "::error::${{ steps.run.outputs.failed }} conformance check(s) failed in ${{ matrix.leg }} (informational; not a merge block)"
            exit 1
          fi

  spec-parity:
    name: spec parity
    # Which MCP revisions mcpx supports against which the conformance suite
    # knows, read from each tool itself. See scripts/spec-parity.py for the
    # deadlines; the variables are written on main only.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: pkgs/mcpx/go.mod
          cache-dependency-path: pkgs/mcpx/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.CONFORMANCE_REPO }}
          ref: ${{ env.CONFORMANCE_REF }}
          path: .conformance

      - name: Read both lists
        id: lists
        run: |
          (cd .conformance && npm install --no-audit --no-fund >/dev/null && npm run build >/dev/null)
          (cd pkgs/mcpx && go build -o "$RUNNER_TEMP/mcpx" ./cmd/mcpx)
          # The suite has no command that lists revisions; its error for an
          # unknown one names every valid version.
          suite=$(node .conformance/dist/index.js list --spec-version x 2>&1 \
            | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort -u | jq -R . | jq -sc .)
          scratch=$(mktemp -d)
          mcpx=$(MCPX_STATE_DIR=$scratch/state MCPX_CACHE_DIR=$scratch/cache HOME=$scratch \
            "$RUNNER_TEMP/mcpx" protocol --json | jq -c '.asServer.supported | sort')
          MCPX_STATE_DIR=$scratch/state MCPX_CACHE_DIR=$scratch/cache HOME=$scratch \
            "$RUNNER_TEMP/mcpx" stop --all >/dev/null 2>&1 || true
          echo "mcpx:  $mcpx"
          echo "suite: $suite"
          {
            echo "mcpx=$mcpx"
            echo "suite=$suite"
          } >>"$GITHUB_OUTPUT"

      - name: Compare
        env:
          VARS: ${{ toJSON(vars) }}
          GH_TOKEN: ${{ secrets.MCPX_CONFORMANCE_VARS_TOKEN }}
          ON_MAIN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          RUN: ${{ github.run_id }}/${{ github.run_attempt }}
          MCPX: ${{ steps.lists.outputs.mcpx }}
          SUITE: ${{ steps.lists.outputs.suite }}
        run: |
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          out=$RUNNER_TEMP/parity
          python3 pkgs/mcpx/scripts/spec-parity.py "$MCPX" "$SUITE" "$now" "$RUN" \
            "$(jq -r '.MCPX_SPEC_PARITY_SUCCESS // ""' <<<"$VARS")" \
            "$(jq -r '.MCPX_SPEC_PARITY_FAILURE // ""' <<<"$VARS")" \
            "$ON_MAIN" "$GITHUB_STEP_SUMMARY" "$out" \
            "$SPEC_PARITY_ALLOW_ONLY_MCPX" "$SPEC_PARITY_ALLOW_ONLY_SUITE"
          status=$(cat "$out/status")
          if [ "$ON_MAIN" = true ]; then
            if [ -z "$GH_TOKEN" ]; then
              echo "> [!CAUTION]" >>"$GITHUB_STEP_SUMMARY"
              echo "> Spec parity was not saved: MCPX_CONFORMANCE_VARS_TOKEN is not set." >>"$GITHUB_STEP_SUMMARY"
            else
              for name in SUCCESS FAILURE; do
                f="$out/${name,,}.json"
                [ -f "$f" ] && gh variable set "MCPX_SPEC_PARITY_$name" --repo "$GITHUB_REPOSITORY" --body "$(cat "$f")"
              done
            fi
          fi
          wait=$(cat "$out/sleep")
          if [ "$status" != ok ]; then
            echo "::warning::spec parity: $status, sleeping ${wait}s"
            sleep "$wait"
          fi
          case $status in
          ok) echo "spec parity: match" ;;
          warn) echo "::warning::mcpx and the conformance suite disagree on MCP revisions; see the summary for the deadline" ;;
          *) echo "::error::spec parity deadline passed, or the lists could not be read; see the summary"; exit 1 ;;
          esac

  records:
    name: compare with the records
    needs: leg
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: pkgs/mcpx/scripts
      - uses: actions/download-artifact@v8
        with:
          pattern: counts-*
          path: counts
          merge-multiple: true
      - name: Compare, and on main update the records
        env:
          VARS: ${{ toJSON(vars) }}
          GH_TOKEN: ${{ secrets.MCPX_CONFORMANCE_VARS_TOKEN }}
          ON_MAIN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          RUN: ${{ github.run_id }}/${{ github.run_attempt }}
        run: |
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            echo "## Conformance records"
            echo
            echo "> [!NOTE]"
            echo "> **Failed conformance checks do not block a merge.** Records are compared on every run and written on \`main\` only."
          } >>"$GITHUB_STEP_SUMMARY"
          if [ "$ON_MAIN" = true ] && [ -z "$GH_TOKEN" ]; then
            {
              echo
              echo "> [!CAUTION]"
              echo "> # Records not saved"
              echo "> The secret \`MCPX_CONFORMANCE_VARS_TOKEN\` is not set, and GITHUB_TOKEN cannot write repository"
              echo "> variables. Add a fine-grained token with *Variables: read and write* on this repository."
            } >>"$GITHUB_STEP_SUMMARY"
          fi
          shopt -s nullglob
          skips_rose=""
          for f in counts/*.json; do
            leg=$(jq -r .leg "$f")
            name="MCPX_CONFORMANCE_$(tr 'a-z-' 'A-Z_' <<<"$leg")"
            if [ "$(jq -r .parsed "$f")" != true ]; then
              { echo; echo "> [!CAUTION]"; echo "> # \`$leg\` did not complete; nothing to compare"; } >>"$GITHUB_STEP_SUMMARY"
              echo "::error::$leg did not complete"
              continue
            fi
            stored=$(jq -r --arg n "$name" '.[$n] // ""' <<<"$VARS")
            rm -f new.json
            rc=0
            python3 pkgs/mcpx/scripts/conformance-record.py "$leg" "$(jq -r .passed "$f")" "$(jq -r .failed "$f")" \
              "$RUN" "$now" "$stored" "$GITHUB_STEP_SUMMARY" new.json \
              "$(jq -r '.checks // empty' "$f")" "$(jq -r '.warnings // 0' "$f")" \
              "$(jq -r '.skipped // empty' "$f")" "$(jq -r '.info // 0' "$f")" \
              "$(jq -c '.skipped_names // empty' "$f")" || rc=$?
            # 3: more checks skipped than the record. Everything is still
            # compared and saved; the job fails once all legs are done.
            [ "$rc" = 3 ] && skips_rose="$skips_rose $leg"
            [ "$rc" != 0 ] && [ "$rc" != 3 ] && { echo "::error::record script failed for $leg ($rc)"; exit "$rc"; }
            if [ -f new.json ] && [ "$ON_MAIN" = true ] && [ -n "$GH_TOKEN" ]; then
              gh variable set "$name" --repo "$GITHUB_REPOSITORY" --body "$(cat new.json)"
              echo "- saved \`$name\`" >>"$GITHUB_STEP_SUMMARY"
            fi
          done
          if [ -n "$skips_rose" ]; then
            echo "::error::more conformance checks skipped than the record on main:$skips_rose"
            exit 1
          fi
