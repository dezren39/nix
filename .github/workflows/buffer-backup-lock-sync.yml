name: buffer-backup lock sync

# Lock-sync gate for pkgs/buffer-backup (#998, after #781).
#
# This package carries two lockfiles for one package.json: Renovate
# updates package-lock.json (npm) only, while the shipped nix build
# installs from bun.lock only (flake.nix: `bun install
# --frozen-lockfile`). The lock-sync check existed in the package's
# sub-flake but no workflow ran it, so PR #980 bumped @types/node to
# ^26 in package.json + package-lock.json, merged green, and left
# bun.lock resolving @types/node 24.19.2 — the npm and bun/nix paths
# silently compiled against different type definitions, the exact
# drift #781 was filed to stop.
#
# This workflow runs the check automatically whenever anything under
# pkgs/buffer-backup/ changes (or this workflow itself changes), so a
# lockfile-only change that desyncs the locks fails visibly instead
# of merging green. The check is a plain python3 script — no nix or
# bun install needed — so the gate stays fast.

# The bun-pin-sync job below (#1091) reuses this workflow's triggers:
# the bun version is pinned twice — bun-version in
# buffer-backup-renovate-bun-sync.yml and version in
# pkgs/bun-bin/hashes.json — and Renovate bumps the workflow pin
# alone, so the pins split by construction (they already did once,
# #1089). The job compares the two pins and fails naming both when
# they disagree.

"on":
  push:
    branches: [main]
    paths:
      - "pkgs/buffer-backup/**"
      - ".github/workflows/buffer-backup-lock-sync.yml"
      - ".github/workflows/buffer-backup-renovate-bun-sync.yml"
      - "pkgs/bun-bin/hashes.json"
      - "pkgs/bun-bin/check-pin-sync.py"

permissions:
  contents: read

concurrency:
  # Same shape as mcpx-nixbuild: push-to-main runs are keyed by run_id
  # so every merged tree gets its own completed check; PR runs share a
  # per-ref group so a new push supersedes its stale run.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  lock-sync:
    name: lock-sync check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check bun.lock and package-lock.json agree
        run: python3 pkgs/buffer-backup/check-lock-sync.py

  # #1013: cleanup-count.test.mjs -- the #1002 regression suite for
  # cleanupCount one-pass convergence -- was run by nothing, so an
  # extension.ts change could silently break the #1002 post-condition
  # and merge green. This job runs the real suite on every
  # pkgs/buffer-backup/** change (the path triggers above already
  # cover it). The suite uses only the node standard library and
  # reads src/extension.ts relative to its own location, so a plain
  # node run suffices; the same suite is also wired as the
  # cleanup-count check in pkgs/buffer-backup/flake.nix.
  cleanup-count:
    name: cleanup-count test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run cleanup-count regression suite (#1002)
        run: node pkgs/buffer-backup/cleanup-count.test.mjs

  # #1091: the two bun pins (workflow bun-version vs
  # pkgs/bun-bin/hashes.json version) were kept in step by a comment
  # only. This job runs the plain-python comparison whenever either
  # pin — or the check script itself — changes (see the path
  # triggers above, extended for exactly these files).
  bun-pin-sync:
    name: bun pin-sync check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check workflow bun-version and pkgs/bun-bin agree
        run: python3 pkgs/bun-bin/check-pin-sync.py
