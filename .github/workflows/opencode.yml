name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# github.ref is the default branch for issue_comment, so a
# workflow+ref group is one repo-wide group for every issue/PR:
# with the default single queue a third bot command silently
# replaces the pending second one. Key by PR/issue number and
# queue every run (mirrors the openchamber fix for the same flaw).
# NOTE: queue: max is only valid with cancel-in-progress: false -- GitHub
# rejects that combination at startup (every run failed to start, 0 jobs,
# after #1172 set it to true). This workflow is the deliberate exception
# to the repo-wide cancel-in-progress sweep: false + queue: max is what
# guarantees no queued /oc command is silently replaced by a later one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false
  queue: max

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a # github-v1.2.19
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/big-pickle
