# User-level Nix configuration (read because this repo lives at
# $XDG_CONFIG_HOME/nix, i.e. ~/.config/nix). Contains no secrets: the rebuild
# scripts run `git add .`, so anything in this directory gets committed.
#
# GitHub access token for fetching `github:` flake inputs. Without one,
# `nix flake update` resolves this flake's ~37 github inputs through the GitHub
# API unauthenticated, at 60 requests/hour; with one, 5000/hour. The token
# itself is written by simple-rebuild.sh (refresh_nix_access_token) from
# `gh auth token` to a 0600 file outside the repo. `include`, not `!include`, so
# a missing file is skipped instead of breaking every nix command. The path is
# relative to this file: ~/.config/nix/../../ is ~.
include ../../.local/share/nix/access-tokens.conf
